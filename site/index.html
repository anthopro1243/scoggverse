<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Scoggverse</title>
  <meta name="description" content="All the Scogg memes from class, plus four games with Dr. Scoggins in them.">
  <meta name="theme-color" content="#120f0d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/cards.css">
  <link rel="stylesheet" href="/src/styles/games.css">
  <link rel="stylesheet" href="/src/styles/home.css">
  <script type="module" src="/src/js/home.js"></script>
</head>
<body>
<!--@header-->
<main id="main">
  <section class="wrap hero">
    <div class="hero__text">
      <h1>The Scoggverse</h1>
      <p class="hero__lede">All the Scogg memes from the class slideshow, plus four games with Dr. Scoggins in them.</p>
      <p class="hero__actions">
        <a class="btn btn--primary btn--big" href="/play/">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
          Play
        </a>
      </p>
      <p class="hero__new">4 games now. <a href="/play/flappy-scogg/">Flappy Scogg</a> works on your phone.</p>
    </div>
    <figure class="poster">
      <img src="/art/poster-uncle.webp" width="640" height="896" alt="Uncle Scogg poster: I want you to not deny yourself an education" fetchpriority="high">
    </figure>
  </section>

  <section class="wrap games-section" aria-labelledby="games-title">
    <h2 id="games-title" class="rule-head">The games</h2>
<!--@games-cards-->
  </section>

  <section class="wrap strip-section" aria-labelledby="strip-title">
    <div class="section-head">
      <h2 id="strip-title">Pulled from the files</h2>
      <button type="button" class="btn btn--small" data-shuffle>Shuffle</button>
    </div>
    <ul class="strip" data-strip aria-live="polite"></ul>
    <noscript><p class="strip__noscript"><a href="/gallery/">Go to the gallery</a> to see the slides.</p></noscript>
  </section>
</main>
<!--@footer-->
</body>
</html>
