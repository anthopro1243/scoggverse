<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · The Scoggverse</title>
  <meta name="description" content="Every slide from the class deck. You can search them by name.">
  <meta name="theme-color" content="#0b0a0c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/cards.css">
  <link rel="stylesheet" href="/src/styles/gallery.css">
  <script type="module" src="/src/js/gallery.js"></script>
</head>
<body>
<!--@header-->
<main id="main">
  <section class="wrap page-head gallery-head">
    <div>
      <h1>The Scogg Files</h1>
      <p>Every slide from the class deck. Newest ones are at the top.</p>
    </div>
    <div class="goal" data-goal>
      <div class="goal__label"><strong data-goal-count>%SHOWN_COUNT%</strong> Scoggs on file. Goal: 1,000.</div>
      <div class="goal__bar" role="progressbar" aria-label="Progress toward the class goal of 1,000 Scoggs" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="%SHOWN_NUM%">
        <span class="goal__fill" data-goal-fill></span>
      </div>
      <div class="goal__note" data-goal-note>Class goal</div>
      <!--@addscogg-->
    </div>
  </section>

  <section class="wrap" aria-label="Scoggs">
    <form class="toolbar" role="search" data-toolbar>
      <label class="toolbar__search">
        <span class="visually-hidden">Search Scoggs by title</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" name="q" placeholder="Search the files (try “Lisa” or “#128”)" autocomplete="off" spellcheck="false" data-search>
      </label>
      <label class="toolbar__sort">
        <span>Sort</span>
        <select name="sort" data-sort>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </label>
      <button type="button" class="btn btn--gold" data-random>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
        Random Scogg
      </button>
    </form>
    <p class="result-count" aria-live="polite" data-count></p>
    <ul class="grid" data-grid></ul>
    <div class="grid-sentinel" data-sentinel aria-hidden="true"></div>
    <p class="empty" hidden data-empty>No Scoggs found. Try “Lisa”.</p>
    <noscript><p class="empty">Turn on JavaScript to see the slides.</p></noscript>
  </section>

  <dialog class="lightbox" aria-labelledby="lightbox-title" data-lightbox>
    <div class="lightbox__frame">
      <div class="lightbox__top">
        <p class="lightbox__meta"><span class="lightbox__page" data-lb-page></span> <span id="lightbox-title" class="lightbox__title" data-lb-title></span></p>
        <div class="lightbox__actions">
          <button type="button" class="icon-btn" data-lb-copy aria-label="Copy link to this Scogg">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="icon-btn" data-lb-close aria-label="Close" autofocus>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="lightbox__stage" data-lb-stage>
        <button type="button" class="lightbox__nav lightbox__nav--prev" data-lb-prev aria-label="Previous Scogg">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <img class="lightbox__img" alt="" data-lb-img>
        <button type="button" class="lightbox__nav lightbox__nav--next" data-lb-next aria-label="Next Scogg">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="lightbox__hint"><span class="lightbox__pos" data-lb-pos></span> <span class="lightbox__keys">Arrow keys to flip through, Esc to close</span></p>
      <p class="toast" role="status" data-toast></p>
    </div>
  </dialog>
</main>
<!--@footer-->
</body>
</html>
